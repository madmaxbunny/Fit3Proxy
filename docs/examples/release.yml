name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Read versionName
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"
          echo "asset=Fit3Proxy-${VN}-debug.apk" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Prepare asset
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" "${{ steps.ver.outputs.asset }}"
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — Fit3Proxy ${{ steps.ver.outputs.versionName }}
          generate_release_notes: true
          files: ${{ steps.ver.outputs.asset }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
